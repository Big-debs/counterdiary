<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · THE LEDGER</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 480px; background: white; border: 1px solid var(--gray-200); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-lg); }
        .auth-card h1 { font-size: 1.6rem; margin-bottom: 8px; }
        .auth-card p { color: var(--gray-600); margin-bottom: 20px; }
        .auth-field { margin-bottom: 14px; }
        .auth-field label { display:block; font-weight:600; margin-bottom:6px; }
        .auth-field input, .auth-field select { width:100%; padding:12px; border:1px solid var(--gray-300); border-radius:10px; font:inherit; }
        .auth-actions { display:grid; gap:10px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <h1>Create account</h1>
            <p>Register as owner, worker, or customer.</p>
            <form id="registerForm">
                <div class="auth-field">
                    <label for="displayName">Full name</label>
                    <input id="displayName" type="text" maxlength="120" required>
                </div>
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input id="email" type="email" required>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input id="password" type="password" minlength="8" required>
                </div>
                <div class="auth-field">
                    <label for="role">Role</label>
                    <select id="role" required>
                        <option value="owner">Owner</option>
                        <option value="worker">Worker</option>
                        <option value="customer">Customer</option>
                    </select>
                </div>
                <div class="auth-actions">
                    <button class="btn btn-primary" type="submit">Create account</button>
                    <a class="btn btn-outline" href="login.html">Already have an account</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const display_name = document.getElementById('displayName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_name, email, password, role })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Registration failed');

                localStorage.setItem('ledger_access_token', data.access_token);
                localStorage.setItem('ledger_refresh_token', data.refresh_token);
                localStorage.setItem('ledger_user', JSON.stringify(data.user));
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert(error.message || 'Registration failed');
            }
        });
    </script>
</body>
</html>
